# Continuous integration: the same release tests Cloud Build runs before a deploy, plus a smoke test of the
# container image that Cloud Run serves. Synthetic data only; no secrets are needed (AI runs on approved templates).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tests:
    name: Release tests, type check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the server and web app dependencies
        run: make setup

      - name: Type check the web app and the device engine
        run: cd frontend && npx tsc -b --noEmit

      - name: Lint the Python code (ruff.toml)
        run: pipx run ruff==0.16.9 check backend e2e docs/diagrams/custom

      - name: Device engine (vitest) and server (pytest) release tests, with the Trust Centre report
        run: make report

      - name: Keep the release test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-report
          path: backend/reports/test_report.json
          if-no-files-found: warn

      - name: Production build of the web app
        run: make build

  container:
    name: Container smoke test
    runs-on: ubuntu-24.04
    needs: release-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the image that Cloud Run serves
        run: docker build -t bardan:ci .

      - name: Start it, check health, the web app and the non-root user
        run: |
          docker run -d --name bardan -p 8080:8080 -e BARDAN_TOKEN_SECRET=ci-only-not-a-secret bardan:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/v1/health >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/v1/health
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          test "$(docker exec bardan id -u)" != "0"

      - name: Container logs
        if: always()
        run: docker logs bardan || true
